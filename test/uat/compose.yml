# The engines the slow acceptance suite talks to. Booted by test/uat when UAT_SLOW=1,
# removed afterwards; the ports are fixed so the steps can name them without discovery.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: app
      MYSQL_USER: noxis
      MYSQL_PASSWORD: noxispw
    ports:
      - "33306:3306"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-prootpw"]
      interval: 2s
      timeout: 3s
      retries: 30

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: rootpw
      MARIADB_DATABASE: app
      MARIADB_USER: noxis
      MARIADB_PASSWORD: noxispw
    ports:
      - "33307:3306"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-uroot", "-prootpw"]
      interval: 2s
      timeout: 3s
      retries: 30
