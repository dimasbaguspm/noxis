components:
    schemas:
        domain.Capabilities:
            properties:
                driver:
                    type: string
                explain_json:
                    type: boolean
                flavor:
                    type: string
                foreign_key_metadata:
                    type: boolean
                index_metadata:
                    type: boolean
                major:
                    type: integer
                minor:
                    type: integer
                notes:
                    items:
                        type: string
                    type: array
                    uniqueItems: false
                patch:
                    type: integer
                row_image_rehearsal:
                    type: boolean
                shadow_ddl_rehearsal:
                    type: boolean
                transactional_dml:
                    type: boolean
                version:
                    type: string
            type: object
        domain.Column:
            properties:
                name:
                    type: string
                type:
                    type: string
            type: object
        domain.ColumnInfo:
            properties:
                default:
                    type: string
                extra:
                    type: string
                key:
                    type: string
                name:
                    type: string
                nullable:
                    type: boolean
                type:
                    type: string
            type: object
        domain.IndexInfo:
            properties:
                columns:
                    items:
                        type: string
                    type: array
                    uniqueItems: false
                name:
                    type: string
                unique:
                    type: boolean
            type: object
        domain.Rows:
            properties:
                columns:
                    items:
                        $ref: '#/components/schemas/domain.Column'
                    type: array
                    uniqueItems: false
                duration_ms:
                    type: integer
                row_count:
                    type: integer
                truncated:
                    type: boolean
                values:
                    items:
                        items:
                            type: string
                        type: array
                    type: array
                    uniqueItems: false
            type: object
        domain.Table:
            properties:
                engine:
                    type: string
                name:
                    type: string
                rows:
                    type: integer
                size_bytes:
                    type: integer
            type: object
        domain.TableDetail:
            properties:
                columns:
                    items:
                        $ref: '#/components/schemas/domain.ColumnInfo'
                    type: array
                    uniqueItems: false
                create_sql:
                    type: string
                engine:
                    type: string
                indexes:
                    items:
                        $ref: '#/components/schemas/domain.IndexInfo'
                    type: array
                    uniqueItems: false
                name:
                    type: string
                rows:
                    type: integer
                size_bytes:
                    type: integer
            type: object
        handlers.ApplyRequest:
            properties:
                confirm_destructive:
                    type: boolean
            type: object
        handlers.CreateProposalRequest:
            properties:
                note:
                    type: string
                query:
                    example: ALTER TABLE users ADD COLUMN note TEXT
                    type: string
                rollback:
                    example: ALTER TABLE users DROP COLUMN note
                    type: string
                tier:
                    enum:
                        - static
                        - shadow
                        - rehearsal
                    type: string
                title:
                    example: add a column
                    type: string
            type: object
        handlers.CreateTargetRequest:
            properties:
                database:
                    example: app
                    type: string
                driver:
                    enum:
                        - mysql
                        - mariadb
                    example: mysql
                    type: string
                host:
                    example: db.internal
                    type: string
                name:
                    example: prod
                    type: string
                options:
                    additionalProperties:
                        type: string
                    type: object
                password:
                    example: not-on-the-wire-back
                    type: string
                port:
                    example: 3306
                    type: integer
                tls_mode:
                    example: preferred
                    type: string
                username:
                    example: noxis
                    type: string
            type: object
        handlers.DecisionRequest:
            properties:
                note:
                    type: string
            type: object
        handlers.Health:
            properties:
                status:
                    type: string
                version:
                    type: string
            type: object
        handlers.JournalEntry:
            properties:
                actor:
                    type: string
                created_at:
                    type: string
                detail:
                    additionalProperties:
                        type: string
                    type: object
                kind:
                    type: string
                ref:
                    type: string
                subject_kind:
                    type: string
                subject_ref:
                    type: string
            type: object
        handlers.ProbeResult:
            properties:
                capabilities:
                    $ref: '#/components/schemas/domain.Capabilities'
                target:
                    $ref: '#/components/schemas/handlers.Target'
            type: object
        handlers.Progress:
            properties:
                percent:
                    type: integer
                stage:
                    type: string
            type: object
        handlers.Proposal:
            properties:
                algorithm:
                    type: string
                applied_at:
                    type: string
                applied_by:
                    type: string
                created_at:
                    type: string
                decided_at:
                    type: string
                decided_by:
                    type: string
                decided_note:
                    type: string
                failure:
                    type: string
                irreversible:
                    type: boolean
                kind:
                    type: string
                note:
                    type: string
                progress:
                    $ref: '#/components/schemas/handlers.Progress'
                proposed_by:
                    type: string
                query:
                    type: string
                ref:
                    type: string
                rehearsal_ref:
                    type: string
                rollback:
                    type: string
                rows_affected:
                    type: integer
                rows_estimated:
                    type: integer
                started_at:
                    type: string
                status:
                    type: string
                target_ref:
                    type: string
                tier:
                    type: string
                title:
                    type: string
                updated_at:
                    type: string
            type: object
        handlers.ProposalDetail:
            properties:
                algorithm:
                    type: string
                applied_at:
                    type: string
                applied_by:
                    type: string
                created_at:
                    type: string
                decided_at:
                    type: string
                decided_by:
                    type: string
                decided_note:
                    type: string
                failure:
                    type: string
                irreversible:
                    type: boolean
                kind:
                    type: string
                note:
                    type: string
                progress:
                    $ref: '#/components/schemas/handlers.Progress'
                proposed_by:
                    type: string
                query:
                    type: string
                ref:
                    type: string
                rehearsal:
                    $ref: '#/components/schemas/handlers.Rehearsal'
                rehearsal_ref:
                    type: string
                rollback:
                    type: string
                rows_affected:
                    type: integer
                rows_estimated:
                    type: integer
                started_at:
                    type: string
                status:
                    type: string
                target_ref:
                    type: string
                tier:
                    type: string
                title:
                    type: string
                updated_at:
                    type: string
            type: object
        handlers.QueryRequest:
            properties:
                limit:
                    example: 100
                    type: integer
                sql:
                    example: SELECT id FROM users
                    type: string
            type: object
        handlers.Rehearsal:
            properties:
                created_at:
                    type: string
                duration_ms:
                    type: integer
                error:
                    type: string
                irreversible:
                    type: boolean
                note:
                    type: string
                plan:
                    type: string
                proposal_ref:
                    type: string
                ref:
                    type: string
                row_diff:
                    type: string
                schema_diff:
                    type: string
                status:
                    type: string
                tier:
                    type: string
            type: object
        handlers.RehearseRequest:
            properties:
                tier:
                    enum:
                        - static
                        - shadow
                        - rehearsal
                    type: string
            type: object
        handlers.Target:
            properties:
                archived_at:
                    type: string
                created_at:
                    type: string
                created_by:
                    type: string
                database:
                    type: string
                driver:
                    type: string
                has_password:
                    type: boolean
                host:
                    type: string
                last_probe_at:
                    type: string
                last_probe_status:
                    type: string
                name:
                    type: string
                options:
                    additionalProperties:
                        type: string
                    type: object
                port:
                    type: integer
                ref:
                    type: string
                server_version:
                    description: What the last probe measured. Empty until a probe succeeds.
                    type: string
                tls_mode:
                    type: string
                updated_at:
                    type: string
                username:
                    type: string
            type: object
        handlers.TestResult:
            properties:
                capabilities:
                    $ref: '#/components/schemas/domain.Capabilities'
                databases:
                    items:
                        type: string
                    type: array
                    uniqueItems: false
            type: object
        handlers.TestTargetRequest:
            properties:
                database:
                    example: app
                    type: string
                driver:
                    enum:
                        - mysql
                        - mariadb
                    example: mysql
                    type: string
                host:
                    example: db.internal
                    type: string
                options:
                    additionalProperties:
                        type: string
                    type: object
                password:
                    example: typed-once
                    type: string
                port:
                    example: 3306
                    type: integer
                tls_mode:
                    example: preferred
                    type: string
                username:
                    example: noxis
                    type: string
            type: object
        handlers.UpdateTargetRequest:
            properties:
                name:
                    type: string
                options:
                    additionalProperties:
                        type: string
                    type: object
                password:
                    type: string
                tls_mode:
                    type: string
                username:
                    type: string
            type: object
        handlers.VersionInfo:
            properties:
                commit:
                    type: string
                latest:
                    $ref: '#/components/schemas/release.Info'
                newer:
                    type: boolean
                release_url:
                    type: string
                version:
                    type: string
            type: object
        handlers.Whoami:
            properties:
                name:
                    type: string
                scopes:
                    items:
                        type: string
                    type: array
                    uniqueItems: false
            type: object
        release.Info:
            properties:
                built_at:
                    description: BuiltAt is the commit timestamp, in RFC 3339, of the build this asset belongs to.
                    type: string
                commit:
                    type: string
                version:
                    type: string
            type: object
        respond.Envelope:
            properties:
                data: {}
                error:
                    $ref: '#/components/schemas/respond.Error'
                meta:
                    $ref: '#/components/schemas/respond.Meta'
            type: object
        respond.Error:
            properties:
                code:
                    type: string
                message:
                    type: string
            type: object
        respond.Meta:
            properties:
                next_cursor:
                    type: string
            type: object
    securitySchemes:
        BearerAuth:
            description: '`Bearer <token>`. The scopes a route needs are declared in the route table; a token without them is refused before the handler runs.'
            in: header
            name: Authorization
            type: apiKey
externalDocs:
    description: ""
    url: ""
info:
    contact:
        name: noXis
    description: Reviewed access to MySQL and MariaDB. An agent reads through `read`, proposes through `propose`, and a human holding `approve` and `apply` decides. A proposal is rehearsed — the schema is rebuilt in a throwaway database and the rollback must restore it — so the reviewer sees evidence rather than a check mark.
    license:
        name: MIT
    title: noXis API
    version: 2.0.0-dev
openapi: 3.1.0
paths:
    /healthz:
        get:
            description: 'Answers without a token: the process is up and this is the version answering.'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/handlers.Health'
                                    error:
                                        $ref: '#/components/schemas/respond.Error'
                                    meta:
                                        $ref: '#/components/schemas/respond.Meta'
                                type: object
                    description: OK
            summary: Liveness
            tags:
                - system
    /openapi.json:
        get:
            description: The OpenAPI document this binary serves, derived from the YAML source at first read.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                type: string
                    description: 'the document, not an envelope: this route answers the contract itself'
            summary: The contract, as JSON
            tags:
                - system
    /openapi.yaml:
        get:
            description: The generated source, exactly as committed.
            responses:
                "200":
                    content:
                        application/yaml:
                            schema:
                                type: string
                    description: the document
            summary: The contract, as YAML
            tags:
                - system
    /v1/proposals:
        get:
            description: Newest first, keyset-paged.
            parameters:
                - description: page size
                  in: query
                  name: limit
                  schema:
                    type: integer
                - description: the last ref of the previous page
                  in: query
                  name: cursor
                  schema:
                    type: string
                - description: filter by target reference
                  in: query
                  name: target
                  schema:
                    type: string
                - description: filter by status
                  in: query
                  name: status
                  schema:
                    type: string
                - description: ddl or dml
                  in: query
                  name: kind
                  schema:
                    type: string
                - description: only the caller's proposals
                  in: query
                  name: mine
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        items:
                                            $ref: '#/components/schemas/handlers.Proposal'
                                        type: array
                                    error:
                                        $ref: '#/components/schemas/respond.Error'
                                    meta:
                                        $ref: '#/components/schemas/respond.Meta'
                                type: object
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/respond.Envelope'
                    description: Bad Request
            security:
                - BearerAuth: []
            summary: The proposal queue
            tags:
                - proposals
            x-scopes:
                - read
    /v1/proposals/{ref}:
        get:
            parameters:
                - description: proposal reference
                  in: path
                  name: ref
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/handlers.ProposalDetail'
                                    error:
                                        $ref: '#/components/schemas/respond.Error'
                                    meta:
                                        $ref: '#/components/schemas/respond.Meta'
                                type: object
                    description: OK
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/respond.Envelope'
                    description: Not Found
            security:
                - BearerAuth: []
            summary: One proposal and its evidence
            tags:
                - proposals
            x-scopes:
                - read
    /v1/proposals/{ref}/apply:
        post:
            description: Requires the apply scope. DML runs in one transaction; DDL runs as one statement, because a receipt for an impossible rollback is a lie. A change the rehearsal called irreversible needs confirm_destructive. A table past the background threshold answers 202 and the progress is read from the proposal.
            parameters:
                - description: proposal reference
                  in: path
                  name: ref
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/handlers.ApplyRequest'
                            description: acknowledge a destructive change
                            summary: body
                description: acknowledge a destructive change
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/handlers.Proposal'
                                    error:
                                        $ref: '#/components/schemas/respond.Error'
                                    meta:
                                        $ref: '#/components/schemas/respond.Meta'
                                type: object
                    description: OK
                "202":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/handlers.Proposal'
                                    error:
                                        $ref: '#/components/schemas/respond.Error'
                                    meta:
                                        $ref: '#/components/schemas/respond.Meta'
                                type: object
                    description: Accepted
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/respond.Envelope'
                    description: Conflict
            security:
                - BearerAuth: []
            summary: Apply an approved proposal
            tags:
                - proposals
            x-scopes:
                - apply
    /v1/proposals/{ref}/approve:
        post:
            description: Requires the approve scope. A token that also proposed the change is refused unless it holds admin, and the exception is journalled as its own line.
            parameters:
                - description: proposal reference
                  in: path
                  name: ref
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/handlers.DecisionRequest'
                            description: an optional note
                            summary: body
                description: an optional note
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/handlers.Proposal'
                                    error:
                                        $ref: '#/components/schemas/respond.Error'
                                    meta:
                                        $ref: '#/components/schemas/respond.Meta'
                                type: object
                    description: OK
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/respond.Envelope'
                    description: Forbidden
            security:
                - BearerAuth: []
            summary: Approve a proposal
            tags:
                - proposals
            x-scopes:
                - approve
    /v1/proposals/{ref}/events:
        get:
            description: 'The append-only history: proposed, rehearsed, approved, applied, refused.'
            parameters:
                - description: proposal reference
                  in: path
                  name: ref
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        items:
                                            $ref: '#/components/schemas/handlers.JournalEntry'
                                        type: array
                                    error:
                                        $ref: '#/components/schemas/respond.Error'
                                    meta:
                                        $ref: '#/components/schemas/respond.Meta'
                                type: object
                    description: OK
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/respond.Envelope'
                    description: Not Found
            security:
                - BearerAuth: []
            summary: The journal of one proposal
            tags:
                - proposals
            x-scopes:
                - read
    /v1/proposals/{ref}/rehearse:
        post:
            description: Only for a proposal nobody has decided yet. Every run is stored, including the ones that failed.
            parameters:
                - description: proposal reference
                  in: path
                  name: ref
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/handlers.RehearseRequest'
                            description: an optional tier
                            summary: body
                description: an optional tier
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/handlers.ProposalDetail'
                                    error:
                                        $ref: '#/components/schemas/respond.Error'
                                    meta:
                                        $ref: '#/components/schemas/respond.Meta'
                                type: object
                    description: OK
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/respond.Envelope'
                    description: Conflict
            security:
                - BearerAuth: []
            summary: Re-run the proof
            tags:
                - proposals
            x-scopes:
                - propose
    /v1/proposals/{ref}/reject:
        post:
            description: Requires the approve scope. A rejection may be the proposer withdrawing their own idea.
            parameters:
                - description: proposal reference
                  in: path
                  name: ref
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/handlers.DecisionRequest'
                            description: an optional note
                            summary: body
                description: an optional note
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/handlers.Proposal'
                                    error:
                                        $ref: '#/components/schemas/respond.Error'
                                    meta:
                                        $ref: '#/components/schemas/respond.Meta'
                                type: object
                    description: OK
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/respond.Envelope'
                    description: Conflict
            security:
                - BearerAuth: []
            summary: Reject a proposal
            tags:
                - proposals
            x-scopes:
                - approve
    /v1/targets:
        get:
            description: One page of governed servers, newest first. Paging is a keyset cursor, never an offset.
            parameters:
                - description: page size
                  in: query
                  name: limit
                  schema:
                    type: integer
                - description: the last ref of the previous page
                  in: query
                  name: cursor
                  schema:
                    type: string
                - description: mysql or mariadb
                  in: query
                  name: driver
                  schema:
                    type: string
                - description: name filter
                  in: query
                  name: q
                  schema:
                    type: string
                - description: include archived targets
                  in: query
                  name: include_archived
                  schema:
                    type: boolean
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        items:
                                            $ref: '#/components/schemas/handlers.Target'
                                        type: array
                                    error:
                                        $ref: '#/components/schemas/respond.Error'
                                    meta:
                                        $ref: '#/components/schemas/respond.Meta'
                                type: object
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/respond.Envelope'
                    description: Bad Request
            security:
                - BearerAuth: []
            summary: List targets
            tags:
                - targets
            x-scopes:
                - read
        post:
            description: Requires the admin scope. The password is sealed with SECRET_KEY and never returned.
            parameters:
                - description: a name for this create; a retry with the same one answers the same row
                  in: header
                  name: Idempotency-Key
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/handlers.CreateTargetRequest'
                            description: the server to govern
                            summary: body
                description: the server to govern
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/handlers.Target'
                                    error:
                                        $ref: '#/components/schemas/respond.Error'
                                    meta:
                                        $ref: '#/components/schemas/respond.Meta'
                                type: object
                    description: the row a retried create already made
                "201":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/handlers.Target'
                                    error:
                                        $ref: '#/components/schemas/respond.Error'
                                    meta:
                                        $ref: '#/components/schemas/respond.Meta'
                                type: object
                    description: Created
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/respond.Envelope'
                    description: Bad Request
            security:
                - BearerAuth: []
            summary: Register a target
            tags:
                - targets
            x-scopes:
                - admin
    /v1/targets/{ref}:
        delete:
            description: 'Nothing is deleted: the target is put away and the journal keeps the row.'
            parameters:
                - description: target reference
                  in: path
                  name: ref
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/handlers.Target'
                                    error:
                                        $ref: '#/components/schemas/respond.Error'
                                    meta:
                                        $ref: '#/components/schemas/respond.Meta'
                                type: object
                    description: OK
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/respond.Envelope'
                    description: Not Found
            security:
                - BearerAuth: []
            summary: Archive a target
            tags:
                - targets
            x-scopes:
                - admin
        get:
            parameters:
                - description: target reference
                  in: path
                  name: ref
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/handlers.Target'
                                    error:
                                        $ref: '#/components/schemas/respond.Error'
                                    meta:
                                        $ref: '#/components/schemas/respond.Meta'
                                type: object
                    description: OK
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/respond.Envelope'
                    description: Not Found
            security:
                - BearerAuth: []
            summary: Read one target
            tags:
