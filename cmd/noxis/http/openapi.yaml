openapi: 3.1.0
info:
  title: noXis API
  version: 2.0.0
  summary: Reviewed access to MySQL and MariaDB for agents.
  description: |
    An agent reads through `read` scope, proposes DDL or DML through `propose`, and a human
    holding `approve` and `apply` decides. A proposal is rehearsed before anyone is asked to
    approve it: the schema is rebuilt in a throwaway database, the statement runs there, and the
    rollback has to bring the schema back.

    Every identifier on the wire is a `ref`, a UUIDv7. Lists are keyset pages: `?limit=` plus
    `?cursor=`, newest first, and `meta.next_cursor` is absent on the last page. A raw `SELECT`
    reports `truncated` instead, because a keyset cannot be inferred from arbitrary SQL.
servers:
  - url: http://localhost:9000
    description: The default listen address
security:
  - bearer: []
tags:
  - name: system
  - name: targets
  - name: read
  - name: proposals
paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness. Public, and says nothing else.
      security: []
      x-scopes: []
      responses:
        "200": { $ref: "#/components/responses/Health" }
  /openapi.json:
    get:
      tags: [system]
      summary: This document, as JSON
      security: []
      x-scopes: []
      responses:
        "200": { description: The OpenAPI document }
  /openapi.yaml:
    get:
      tags: [system]
      summary: This document, as YAML
      security: []
      x-scopes: []
      responses:
        "200": { description: The OpenAPI document }
  /v1/whoami:
    get:
      tags: [system]
      summary: The caller this token is
      x-scopes: []
      responses:
        "200": { $ref: "#/components/responses/Identity" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/targets:
    get:
      tags: [targets]
      summary: List targets, newest first
      x-scopes: [read]
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: driver, in: query, schema: { type: string, enum: [mysql, mariadb] } }
        - { name: q, in: query, schema: { type: string } }
        - { name: include_archived, in: query, schema: { type: boolean } }
      responses:
        "200": { $ref: "#/components/responses/TargetPage" }
        "400": { $ref: "#/components/responses/Invalid" }
    post:
      tags: [targets]
      summary: Register a target. Needs `admin`.
      x-scopes: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TargetCreate" }
      responses:
        "201": { $ref: "#/components/responses/Target" }
        "400": { $ref: "#/components/responses/Invalid" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/targets/{ref}:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      tags: [targets]
      summary: One target
      x-scopes: [read]
      responses:
        "200": { $ref: "#/components/responses/Target" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [targets]
      summary: Change a name, a username, the TLS mode, the options, or the password
      x-scopes: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TargetPatch" }
      responses:
        "200": { $ref: "#/components/responses/Target" }
        "400": { $ref: "#/components/responses/Invalid" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [targets]
      summary: Archive a target. Nothing is deleted, and a second attempt is a conflict.
      x-scopes: [admin]
      responses:
        "200": { $ref: "#/components/responses/Target" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/targets/{ref}/probe:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    post:
      tags: [targets]
      summary: Connect once and record what the engine actually is
      x-scopes: [read]
      responses:
        "200": { $ref: "#/components/responses/Target" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unsupported" }
  /v1/targets/{ref}/capabilities:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      tags: [targets]
      summary: What the last probe measured, and what it implies
      x-scopes: [read]
      responses:
        "200":
          description: The capabilities the measured engine allows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/targets/{ref}/query:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    post:
      tags: [read]
      summary: Run one SELECT, EXPLAIN or SHOW. A write is refused before a connection exists.
      x-scopes: [read]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Query" }
      responses:
        "200":
          description: The rows, and whether the row ceiling cut them short
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rows" }
        "400": { $ref: "#/components/responses/Invalid" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/targets/{ref}/databases:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    get:
      tags: [read]
      summary: The schemas behind a target
      x-scopes: [read]
      responses:
        "200":
          description: Schema names
          content:
            application/json:
              schema: { type: array, items: { type: string } }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/targets/{ref}/databases/{db}/tables:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
      - { $ref: "#/components/parameters/Database" }
    get:
      tags: [read]
      summary: The tables in one schema
      x-scopes: [read]
      responses:
        "200":
          description: Tables with the engine's own row estimate
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Table" } }
        "400": { $ref: "#/components/responses/Invalid" }
  /v1/targets/{ref}/databases/{db}/tables/{table}:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
      - { $ref: "#/components/parameters/Database" }
      - { $ref: "#/components/parameters/Table" }
    get:
      tags: [read]
      summary: One table's columns, indexes and CREATE statement
      x-scopes: [read]
      responses:
        "200":
          description: The table, as the engine describes it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TableDetail" }
        "400": { $ref: "#/components/responses/Invalid" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/targets/{ref}/proposals:
    parameters:
      - { $ref: "#/components/parameters/Ref" }
    post:
      tags: [proposals]
      summary: Propose a change; it is rehearsed before the answer
      x-scopes: [propose]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProposalCreate" }
      responses:
        "201": { $ref: "#/components/responses/Proposal" }
        "400": { $ref: "#/components/responses/Invalid" }
  /v1/proposals:
    get:
      tags: [proposals]
      summary: The queue, newest first
      x-scopes: [read]
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/Status" } }
        - { name: kind, in: query, schema: { type: string, enum: [dml, ddl] } }
        - { name: target, in: query, schema: { type: string } }
        - { name: mine, in: query, schema: { type: boolean } }
      responses:
        "200": { $ref: "#/components/responses/ProposalPage" }
        "400": { $ref: "#/components/responses/Invalid" }
  /v1/proposals/{ref}:
    parameters:
      - { $ref: "#/components/parameters/ProposalRef" }
    get:
      tags: [proposals]
      summary: One proposal. While it applies, this is the progress and the receipt.
      x-scopes: [read]
      responses:
        "200": { $ref: "#/components/responses/Proposal" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/proposals/{ref}/rehearse:
    parameters:
      - { $ref: "#/components/parameters/ProposalRef" }
    post:
      tags: [proposals]
      summary: Re-run the proof for a proposal nobody has decided yet
      x-scopes: [propose]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tier: { $ref: "#/components/schemas/Tier" }
      responses:
        "200": { $ref: "#/components/responses/Proposal" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/proposals/{ref}/approve:
    parameters:
      - { $ref: "#/components/parameters/ProposalRef" }
    post:
      tags: [proposals]
      summary: Approve. The proposer cannot approve their own change unless the token is an admin.
      x-scopes: [approve]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Decision" }
      responses:
        "200": { $ref: "#/components/responses/Proposal" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/proposals/{ref}/reject:
    parameters:
      - { $ref: "#/components/parameters/ProposalRef" }
    post:
      tags: [proposals]
      summary: Reject, which may also be the proposer withdrawing
      x-scopes: [approve]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Decision" }
      responses:
        "200": { $ref: "#/components/responses/Proposal" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/proposals/{ref}/apply:
    parameters:
      - { $ref: "#/components/parameters/ProposalRef" }
    post:
      tags: [proposals]
      summary: Run the approved statement. 202 means "poll the proposal".
      description: |
        Above `ApplyBackgroundRows` the claim happens here and the statement runs behind the
        request: the answer is 202 with the proposal in `applying`, and `GET /v1/proposals/{ref}`
        carries `progress` while it runs and `algorithm` when it ends. Below the threshold the
        answer waits and the receipt comes back with it.
      x-scopes: [apply]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm_destructive:
                  type: boolean
                  description: Required when the rehearsal marked the change irreversible.
      responses:
        "200": { $ref: "#/components/responses/Proposal" }
        "202": { $ref: "#/components/responses/Proposal" }
        "400": { $ref: "#/components/responses/Invalid" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/proposals/{ref}/events:
    parameters:
      - { $ref: "#/components/parameters/ProposalRef" }
    get:
      tags: [proposals]
      summary: The append-only history of one proposal, newest first
      x-scopes: [read]
      responses:
        "200":
          description: Journal lines
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/JournalEntry" } }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        A token declared in `TOKENS`. Its name is the identity in the journal; its scopes are what
        it may do. Every response carries `X-Request-Id`.
  parameters:
    Ref:
      name: ref
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: A target's UUIDv7 reference
    ProposalRef:
      name: ref
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: A proposal's UUIDv7 reference
    Database:
      name: db
      in: path
      required: true
      schema: { type: string }
    Table:
      name: table
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, format: uuid }
      description: The `ref` the next page starts after. Never an offset.
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: not_found }
        message: { type: string }
    Status:
      type: string
      enum: [draft, verified, failed, approved, rejected, applying, applied]
    Tier:
      type: string
      enum: [static, shadow, rehearsal]
    Algorithm:
      type: string
      enum: [INSTANT, INPLACE, COPY]
    Progress:
      type: object
      properties:
        stage: { type: string }
        percent:
          type: integer
          description: -1 when the engine does not report a percentage
    TargetCreate:
      type: object
      required: [name, driver, host, database, username]
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{1,62}$" }
        driver: { type: string, enum: [mysql, mariadb] }
        host: { type: string }
        port: { type: integer, default: 3306 }
        database: { type: string }
        username: { type: string }
        password: { type: string, writeOnly: true }
        tls_mode: { type: string, enum: [preferred, skip-verify, verify] }
        options: { type: object, additionalProperties: { type: string } }
    TargetPatch:
      type: object
      properties:
        name: { type: string }
        username: { type: string }
        password: { type: string, writeOnly: true }
        tls_mode: { type: string, enum: [preferred, skip-verify, verify] }
        options: { type: object, additionalProperties: { type: string } }
    Target:
      type: object
      properties:
        ref: { type: string, format: uuid }
        name: { type: string }
        driver: { type: string }
        host: { type: string }
        port: { type: integer }
        database: { type: string }
        username: { type: string }
        tls_mode: { type: string }
        options: { type: object, additionalProperties: { type: string } }
        has_password:
          type: boolean
          description: The password itself is never on the wire.
        created_by: { type: string }
        server_version: { type: string }
        last_probe_at: { type: string, format: date-time }
        last_probe_status: { type: string }
        archived_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Capabilities:
      type: object
      properties:
        driver: { type: string }
        version: { type: string }
        notes: { type: array, items: { type: string } }
    Query:
      type: object
      required: [sql]
      properties:
        sql: { type: string }
        limit: { type: integer }
    Rows:
      type: object
      properties:
        columns: { type: array, items: { type: object, properties: { name: { type: string } } } }
        values:
          type: array
          items:
            type: array
            items: { type: [string, "null"] }
        row_count: { type: integer }
        truncated:
          type: boolean
          description: True when the ceiling cut the result short.
        duration_ms: { type: integer }
    Table:
      type: object
      properties:
        name: { type: string }
        engine: { type: string }
        rows: { type: integer }
    TableDetail:
      type: object
      properties:
        name: { type: string }
        columns: { type: array, items: { type: object } }
        indexes: { type: array, items: { type: object } }
        create_sql: { type: string }
    ProposalCreate:
      type: object
      required: [title, query]
      properties:
        title: { type: string, maxLength: 200 }
        query: { type: string }
        rollback:
          type: string
          description: Empty is the honest way to say there is no way back.
        note: { type: string }
        tier: { $ref: "#/components/schemas/Tier" }
    Decision:
      type: object
      properties:
        note: { type: string }
    Proposal:
      type: object
      properties:
        ref: { type: string, format: uuid }
        target_ref: { type: string, format: uuid }
        title: { type: string }
        kind: { type: string, enum: [dml, ddl] }
        query: { type: string }
        rollback: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        tier: { $ref: "#/components/schemas/Tier" }
        irreversible: { type: boolean }
        proposed_by: { type: string }
        rehearsal_ref: { type: string }
        decided_by: { type: string }
        decided_at: { type: string, format: date-time }
        applied_by: { type: string }
        applied_at: { type: string, format: date-time }
        failure: { type: string }
        started_at: { type: string, format: date-time }
        progress: { $ref: "#/components/schemas/Progress" }
        algorithm: { $ref: "#/components/schemas/Algorithm" }
        rows_estimated: { type: integer }
        rows_affected: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Rehearsal:
      type: object
      properties:
        ref: { type: string, format: uuid }
        proposal_ref: { type: string, format: uuid }
        tier: { $ref: "#/components/schemas/Tier" }
        status: { type: string, enum: [verified, partial, failed, unsupported] }
        schema_diff: { type: string }
        row_diff: { type: string }
        plan: { type: string }
        irreversible: { type: boolean }
        note: { type: string }
        duration_ms: { type: integer }
    JournalEntry:
      type: object
      properties:
        ref: { type: string, format: uuid }
        subject_ref: { type: string }
        subject_kind: { type: string }
        kind: { type: string }
        actor: { type: string }
        detail: { type: object, additionalProperties: { type: string } }
        created_at: { type: string, format: date-time }
  responses:
    Health:
      description: The process is up
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string }
              version: { type: string }
    Identity:
      description: The caller and its scopes
      content:
        application/json:
          schema:
            type: object
            properties:
              name: { type: string }
              scopes: { type: array, items: { type: string } }
    Target:
      description: One target
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Target" }
    TargetPage:
      description: One page of targets
      content:
        application/json:
          schema:
            type: array
            items: { $ref: "#/components/schemas/Target" }
    Proposal:
      description: One proposal, with its receipt once it has one
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Proposal" }
    ProposalPage:
      description: One page of proposals
      content:
        application/json:
          schema:
            type: array
            items: { $ref: "#/components/schemas/Proposal" }
    Invalid:
      description: The request cannot be acted on
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: A bearer token is required, or the one sent is not accepted
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The token does not hold the scope, or is not allowed this decision
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Nothing has that reference
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The state does not allow this
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unsupported:
      description: The engine, or the stored configuration, cannot do this
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
