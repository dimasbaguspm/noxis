<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>noxis console</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: #0d1117; color: #c9d1d9; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #161b22; border-bottom: 1px solid #30363d; }
  header h1 { font-size: 15px; margin: 0; color: #58a6ff; }
  header .spacer { flex: 1; }
  main { display: grid; grid-template-columns: 380px 1fr; gap: 16px; padding: 16px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 14px; }
  .card h2 { font-size: 13px; margin: 0 0 10px; color: #8b949e; text-transform: uppercase; letter-spacing: .05em; }
  .node { display: inline-block; padding: 4px 12px; margin: 2px 4px 2px 0; border: 1px solid #30363d; border-radius: 99px; cursor: pointer; background: #0d1117; }
  .node.on { border-color: #58a6ff; color: #58a6ff; }
  .node .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .up { background: #3fb950; } .online { background: #3fb950; } .error { background: #f85149; } .offline { background: #8b949e; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #21262d; font-size: 13px; }
  th { color: #8b949e; }
  .btn { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; padding: 6px 14px; cursor: pointer; font: inherit; }
  .btn:hover { border-color: #58a6ff; }
  .btn.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .btn.tab { padding: 4px 12px; border-radius: 6px 6px 0 0; }
  .btn.tab.on { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  input, select, textarea { width: 100%; background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; padding: 6px 8px; font: inherit; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #58a6ff; }
  textarea { min-height: 140px; resize: vertical; }
  .row { display: flex; gap: 8px; } .row > * { flex: 1; }
  .muted { color: #8b949e; font-size: 12px; }
  .err { color: #f85149; white-space: pre-wrap; }
  .ok { color: #3fb950; white-space: pre-wrap; }
  pre.out { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 10px; min-height: 140px; white-space: pre-wrap; word-break: break-word; }
  .rm { background: none; border: none; color: #f85149; cursor: pointer; font-size: 14px; }
  .detail { font-size: 12px; color: #8b949e; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>noxis console</h1>
  <span id="nodes"></span>
  <span class="spacer"></span>
  <span class="muted" id="clock"></span>
</header>
<main>
  <div>
    <div class="card">
      <h2>engines — <span id="snode"></span></h2>
      <table>
        <thead><tr><th>name</th><th>type</th><th>version</th><th>ports</th><th></th></tr></thead>
        <tbody id="engines"></tbody>
      </table>
      <div class="row" style="margin-top:10px">
        <input id="en_name" placeholder="name (e.g. db1)">
        <select id="en_type"></select>
        <input id="en_version" placeholder="version">
      </div>
      <div class="row" style="margin-top:8px">
        <input id="en_ports" placeholder="ports host:container, comma sep (optional)">
        <button class="btn" id="btn_add">add</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn primary" id="btn_save">save spec</button>
        <button class="btn" id="btn_stop">stop engines</button>
      </div>
      <div class="detail" id="spec_detail"></div>
    </div>
    <div class="card" style="margin-top:16px">
      <h2>node status</h2>
      <div id="status"></div>
    </div>
  </div>
  <div class="card">
    <h2>doorman</h2>
    <div class="row">
      <button class="btn tab on" data-op="query">query</button>
      <button class="btn tab" data-op="alter">alter</button>
      <button class="btn tab" data-op="rollback">rollback</button>
      <button class="btn tab" data-op="analytics">analytics</button>
    </div>
    <div style="margin:10px 0"><select id="op_engine"></select></div>
    <textarea id="op_sql" placeholder="SQL — e.g. SELECT 6*6  (analytics: the table name)"></textarea>
    <div style="margin-top:10px"><button class="btn primary" id="btn_run">run</button></div>
    <pre class="out" id="op_out"></pre>
  </div>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const state = { node: null, spec: { engines: [] }, op: "query" };
const engines = {
  postgres: ["16-alpine", "16.6-alpine", "17-alpine"],
  mariadb:  ["11"],
  mysql:    ["8"],
};

async function api(method, path, body) {
  try {
    const res = await fetch(path, {
      method,
      headers: body ? { "Content-Type": "application/json" } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    const text = await res.text();
    const data = text ? JSON.parse(text) : null;
    return { ok: res.ok, status: res.status, data };
  } catch (e) {
    return { ok: false, status: 0, data: { error: String(e) } };
  }
}

function fmtTS(ts) { return ts ? new Date(ts * 1000).toLocaleString() : ""; }

async function refresh() {
  const { ok, data } = await api("GET", "/v1/status");
  if (!ok) return;
  state.nodes = data.nodes || [];
  const wrap = $("nodes");
  wrap.innerHTML = "";
  for (const n of state.nodes) {
    const el = document.createElement("span");
    el.className = "node" + (n.Node === state.node ? " on" : "");
    el.innerHTML = `<span class="dot ${n.State}"></span>${n.Node}`;
    el.onclick = () => selectNode(n.Node);
    wrap.appendChild(el);
  }
  if (!state.node && state.nodes.length) selectNode(state.nodes[0].Node);
  const cur = state.nodes.find((n) => n.Node === state.node);
  $("status").innerHTML = cur
    ? `<strong class="${cur.State}">${cur.State}</strong> <span class="muted">since ${fmtTS(cur.TS)}</span><div class="detail">${escapeHtml(cur.Detail || "")}</div>`
    : '<span class="muted">no nodes registered</span>';
  $("clock").textContent = new Date().toLocaleTimeString();
}

function escapeHtml(s) { return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

async function selectNode(name) {
  state.node = name;
  $("snode").textContent = name;
  const { ok, data } = await api("GET", "/v1/nodes/" + name + "/spec");
  state.spec = ok ? data : { engines: [] };
  renderEngines();
  refresh();
}

function renderEngines() {
  const tbody = $("engines");
  tbody.innerHTML = "";
  state.spec.engines.forEach((e, i) => {
    const tr = document.createElement("tr");
    const ports = Object.entries(e.ports || {}).map(([h, c]) => h + ":" + c).join(", ");
    tr.innerHTML = `<td>${escapeHtml(e.name)}</td><td>${escapeHtml(e.type)}</td><td>${escapeHtml(e.version)}</td><td>${escapeHtml(ports)}</td><td><button class="rm" title="remove">✕</button></td>`;
    tr.querySelector(".rm").onclick = () => { state.spec.engines.splice(i, 1); renderEngines(); };
    tbody.appendChild(tr);
  });
  $("spec_detail").textContent = state.spec.engines.length ? `${state.spec.engines.length} engine(s) assigned` : "no spec assigned";
  fillEngineSelects();
}

function fillEngineSelects() {
  const sel = $("en_type");
  const prev = sel.value;
  sel.innerHTML = Object.keys(engines).map((k) => `<option>${k}</option>`).join("");
  sel.value = prev || "postgres";
  $("en_version").value = engines[sel.value][0];
  sel.onchange = () => { $("en_version").value = engines[sel.value][0]; };
  const op = $("op_engine");
  op.innerHTML = state.spec.engines.map((e) => `<option>${escapeHtml(e.name)}</option>`).join("") || '<option value="">(no engine)</option>';
  op.value = op.value || (state.spec.engines[0] && state.spec.engines[0].name) || "";
}

function saveSpec(engines) {
  $("btn_save").disabled = true;
  const detail = $("spec_detail");
  api("PUT", "/v1/nodes/" + state.node + "/spec", { engines }).then((res) => {
    $("btn_save").disabled = false;
    if (!res.ok) { detail.textContent = "save failed: " + (res.data && res.data.error); return; }
    selectNode(state.node);
  });
}

$("en_type").onchange = null;
$("btn_add").onclick = () => {
  const name = $("en_name").value.trim();
  if (!name) return;
  const e = { name, type: $("en_type").value, version: $("en_version").value.trim() };
  const ports = $("en_ports").value.trim();
  if (ports) { e.ports = {}; for (const p of ports.split(",")) { const [h, c] = p.trim().split(":"); if (h && c) e.ports[h] = c; } }
  state.spec.engines.push(e);
  $("en_name").value = ""; $("en_ports").value = "";
  renderEngines();
};
$("btn_save").onclick = () => saveSpec(state.spec.engines);
$("btn_stop").onclick = () => saveSpec([]);

document.querySelectorAll(".btn.tab").forEach((b) => {
  b.onclick = () => {
    state.op = b.dataset.op;
    document.querySelectorAll(".btn.tab").forEach((x) => x.classList.remove("on"));
    b.classList.add("on");
    $("op_sql").placeholder = b.dataset.op === "analytics" ? "table name" : "SQL";
  };
});

$("btn_run").onclick = async () => {
  const engine = $("op_engine").value;
  const sql = $("op_sql").value.trim();
  const out = $("op_out");
  if (!engine) { out.textContent = "no engine assigned"; return; }
  if (!sql) { out.textContent = "enter SQL"; return; }
  out.textContent = "running…";
  const body = state.op === "analytics" ? { engine, table: sql } : { engine, sql };
  const { ok, data } = await api("POST", "/v1/nodes/" + state.node + "/doorman/" + state.op, body);
  if (!ok) { out.className = "out err"; out.textContent = (data && data.error) || "HTTP " + res.status; return; }
  out.className = "out ok";
  out.textContent = data.output !== undefined ? data.output : JSON.stringify(data, null, 2);
};

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
