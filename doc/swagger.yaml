openapi: 3.0.0
info:
  description: "SQL console API: manage database connections and run"
  title: noxis API
  contact: {}
  version: 0.1.0
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: process is alive
  /v1/connections/status/stream:
    get:
      summary: Reachability stream for every connection (SSE, one tick per 5s)
      responses:
        "200":
          description: text/event-stream
          content:
            "*/*":
              schema:
                type: string
  /v1/memcache/connections:
    get:
      summary: List redis connections (passwords redacted)
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                properties:
                  connections:
                    type: array
                    items:
                      $ref: "#/components/schemas/entity.Connection"
    post:
      summary: Create or update a redis connection (database is the db index)
      requestBody:
        $ref: "#/components/requestBodies/entity.Connection"
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Connection"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/memcache/connections/{name}":
    get:
      summary: Get one redis connection (password redacted)
      parameters:
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Connection"
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
    delete:
      summary: Delete a redis connection
      parameters:
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: deleted
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/memcache/connections/{name}/flush":
    post:
      summary: Empty the connected database (FLUSHDB, never FLUSHALL)
      parameters:
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/controller.memcacheFlushBody"
        description: confirm must repeat the connection name
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                properties:
                  status:
                    type: string
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/memcache/connections/{name}/keys":
    get:
      summary: Browse keys by pattern (bounded scan, with type, TTL and size)
      parameters:
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
        - description: glob pattern (default *)
          name: pattern
          in: query
          schema:
            type: string
        - description: scan cap (default 500, max 5000)
          name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/memcache.KeyPage"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
    delete:
      summary: Remove keys (the selected ones only)
      parameters:
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/controller.memcacheKeysBody"
        description: keys to remove
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/memcache/connections/{name}/stats":
    get:
      summary: Memcache INFO snapshot (memory, clients, hits, persistence)
      parameters:
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/memcache.Stats"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/memcache/connections/{name}/stats/stream":
    get:
      summary: Memcache stats stream (SSE, one INFO snapshot every 2s)
      parameters:
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: text/event-stream
          content:
            "*/*":
              schema:
                type: string
  "/v1/memcache/connections/{name}/test":
    post:
      summary: Test that a redis connection answers
      parameters:
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                properties:
                  status:
                    type: string
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/memcache/connections/{name}/value":
    get:
      summary: Inspect one key's value (rendered per its type)
      parameters:
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
        - description: key name
          name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Result"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  /v1/mongodb/changes:
    get:
      summary: List MongoDB requests (newest first)
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                properties:
                  changes:
                    type: array
                    items:
                      $ref: "#/components/schemas/entity.Change"
    post:
      summary: Submit a MongoDB request (validated on a scratch collection)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/controller.mongoChangeBody"
        description: connection, notes and the request
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Change"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/mongodb/changes/{id}":
    get:
      summary: Get one MongoDB request
      parameters:
        - description: change id
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Change"
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/mongodb/changes/{id}/apply":
    post:
      summary: Apply an approved MongoDB request (no rollback exists)
      parameters:
        - description: change id
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Change"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/mongodb/changes/{id}/approve":
    post:
      summary: Approve a validated MongoDB request (self-approval allowed)
      parameters:
        - description: change id
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Change"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/mongodb/changes/{id}/reject":
    post:
      summary: Reject a MongoDB request (kept as an artifact, never deleted)
      parameters:
        - description: change id
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Change"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  /v1/mongodb/connections:
    get:
      summary: List MongoDB connections (passwords redacted)
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                properties:
                  connections:
                    type: array
                    items:
                      $ref: "#/components/schemas/entity.Connection"
    post:
      summary: Create or update a MongoDB connection
      requestBody:
        $ref: "#/components/requestBodies/entity.Connection"
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Connection"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/mongodb/connections/{name}":
    get:
      summary: Get one MongoDB connection (password redacted)
      parameters:
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Connection"
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
    delete:
      summary: Delete a MongoDB connection
      parameters:
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: deleted
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/mongodb/connections/{name}/collections":
    get:
      summary: List a database's collections with their sizes
      parameters:
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
        - description: database name
          name: database
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                properties:
                  collections:
                    type: array
                    items:
                      $ref: "#/components/schemas/mongodb.Collection"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/mongodb/connections/{name}/databases":
    get:
      summary: List databases with their sizes
      parameters:
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                properties:
                  databases:
                    type: array
                    items:
                      $ref: "#/components/schemas/mongodb.Database"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/mongodb/connections/{name}/requests":
    post:
      summary: Run a read request (find | aggregate | count)
      parameters:
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/mongodb.Request"
        description: op, database, collection, filter and value as Extended JSON
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/mongodb.Result"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/mongodb/connections/{name}/stats":
    get:
      summary: MongoDB stats snapshot (server, database and collection)
      parameters:
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
        - description: database to describe
          name: database
          in: query
          schema:
            type: string
        - description: collection to describe
          name: collection
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/mongodb.Stats"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/mongodb/connections/{name}/stats/stream":
    get:
      summary: MongoDB stats stream (SSE, one snapshot every 2s)
      parameters:
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
        - description: database to describe
          name: database
          in: query
          schema:
            type: string
        - description: collection to describe
          name: collection
          in: query
          schema:
            type: string
      responses:
        "200":
          description: text/event-stream
          content:
            "*/*":
              schema:
                type: string
  "/v1/mongodb/connections/{name}/test":
    post:
      summary: Test that a MongoDB connection answers
      parameters:
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                properties:
                  status:
                    type: string
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  /v1/sql/changes:
    get:
      summary: List proposed SQL changes (newest first)
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                properties:
                  changes:
                    type: array
                    items:
                      $ref: "#/components/schemas/entity.Change"
    post:
      summary: Submit a change (validates query + rollback; nothing persists)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/entity.Change"
        description: connection, notes, query, rollback
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Change"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/sql/changes/{id}":
    get:
      summary: Get one change
      parameters:
        - description: change id
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Change"
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/sql/changes/{id}/apply":
    post:
      summary: Apply an approved change (transactional)
      parameters:
        - description: change id
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Change"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/sql/changes/{id}/approve":
    post:
      summary: Approve a validated change (self-approval allowed)
      parameters:
        - description: change id
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Change"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/sql/changes/{id}/reject":
    post:
      summary: Reject a change (kept as an artifact, never deleted)
      parameters:
        - description: change id
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Change"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  /v1/sql/connections:
    get:
      summary: List connections (passwords redacted)
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                properties:
                  connections:
                    type: array
                    items:
                      $ref: "#/components/schemas/entity.Connection"
    post:
      summary: Create or update a connection
      requestBody:
        $ref: "#/components/requestBodies/entity.Connection"
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Connection"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/sql/connections/{name}":
    get:
      summary: Get one connection (password redacted)
      parameters:
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Connection"
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
    delete:
      summary: Delete a connection (and its changes)
      parameters:
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: deleted
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/sql/connections/{name}/alter":
    post:
      summary: Apply a write directly (DML or DDL)
      parameters:
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/controller.opBody"
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Result"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/sql/connections/{name}/analytics":
    post:
      summary: Refresh planner statistics for a table
      parameters:
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/controller.opBody"
        description: table
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Result"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/sql/connections/{name}/query":
    post:
      summary: Run a SQL console op (query | alter | rollback | analytics)
      parameters:
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/controller.opBody"
        description: sql (or table for analytics)
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Result"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/sql/connections/{name}/rollback":
    post:
      summary: Dry-run statements inside a transaction that always rolls back
      parameters:
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/controller.opBody"
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Result"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/sql/connections/{name}/schema":
    get:
      summary: Introspect a connection's tables and columns
      parameters:
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                properties:
                  tables:
                    type: array
                    items:
                      $ref: "#/components/schemas/sql.Table"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/sql/connections/{name}/stats":
    get:
      summary: Instance stats snapshot (connections, size, cache, throughput)
      parameters:
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/sql.Stats"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/sql/connections/{name}/stats/stream":
    get:
      summary: Instance stats stream (SSE, one snapshot every 2s)
      parameters:
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: text/event-stream
          content:
            "*/*":
              schema:
                type: string
  "/v1/sql/connections/{name}/tables/{table}/rows":
    get:
      summary: Preview a table's rows
      parameters:
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
        - description: table name (unqualified)
          name: table
          in: path
          required: true
          schema:
            type: string
        - description: schema (defaults to the driver's)
          name: schema
          in: query
          schema:
            type: string
        - description: row cap (default 100, max 500)
          name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Result"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/sql/connections/{name}/test":
    post:
      summary: Test that a connection answers
      parameters:
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                properties:
                  status:
                    type: string
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
components:
  requestBodies:
    entity.Connection:
      content:
        application/json:
          schema:
