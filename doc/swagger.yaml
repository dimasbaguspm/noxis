definitions:
  controller.putSpecBody:
    properties:
      engines:
        items:
          $ref: '#/definitions/entity.Engine'
        type: array
    type: object
  controller.queryOutput:
    properties:
      output:
        type: string
    type: object
  controller.queryRequest:
    properties:
      engine:
        type: string
      sql:
        type: string
    type: object
  entity.Engine:
    properties:
      env:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      ports:
        additionalProperties:
          type: string
        type: object
      type:
        type: string
      version:
        type: string
    type: object
  entity.NodeStatus:
    properties:
      detail:
        type: string
      node:
        type: string
      state:
        description: ok | error
        type: string
      ts:
        description: unix seconds
        format: int64
        type: integer
    type: object
  entity.Spec:
    properties:
      engines:
        items:
          $ref: '#/definitions/entity.Engine'
        type: array
      node:
        type: string
    type: object
info:
  contact: {}
  description: 'Master REST API: frontends read node state here; the master'
  title: noxis control plane API
  version: 0.1.0
paths:
  /healthz:
    get:
      responses:
        "200":
          description: process is alive
      summary: Liveness probe
  /readyz:
    get:
      responses:
        "200":
          description: store is reachable
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Readiness probe (sqlite ping)
  /v1/nodes/{node}/query:
    post:
      parameters:
      - description: slave node id
        in: path
        name: node
        required: true
        type: string
      - description: engine and SQL
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.queryRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.queryOutput'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: node not connected
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Run a query against an engine on the node (SQL engines)
  /v1/nodes/{node}/register:
    post:
      parameters:
      - description: slave node id
        in: path
        name: node
        required: true
        type: string
      responses:
        "204":
          description: registered
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a slave node (one-shot)
  /v1/nodes/{node}/spec:
    get:
      parameters:
      - description: slave node id
        in: path
        name: node
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.Spec'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Read a node's desired engines
    put:
      parameters:
      - description: slave node id
        in: path
        name: node
        required: true
        type: string
      - description: desired engines
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.putSpecBody'
      responses:
        "204":
          description: accepted and published
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Set a node's desired engines (publishes the event to the slave)
  /v1/status:
    get:
      responses:
        "200":
          description: status of every node
          schema:
            properties:
              nodes:
                items:
                  $ref: '#/definitions/entity.NodeStatus'
                type: array
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Node statuses (reported runtime merged with registered nodes)
swagger: "2.0"
