openapi: 3.0.0
info:
  description: "Master REST API: frontends read node state here; the master"
  title: noxis control plane API
  contact: {}
  version: 0.1.0
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: process is alive
  "/v1/nodes/{node}/query":
    post:
      summary: Run a query against an engine on the node (SQL engines)
      parameters:
        - description: slave node id
          name: node
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/controller.queryRequest"
        description: engine and SQL
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/controller.queryOutput"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "503":
          description: node not connected
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/nodes/{node}/register":
    post:
      summary: Register a slave node (one-shot)
      parameters:
        - description: slave node id
          name: node
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: registered
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/nodes/{node}/spec":
    get:
      summary: Read a node's desired engines
      parameters:
        - description: slave node id
          name: node
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Spec"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
    put:
      summary: Set a node's desired engines (publishes the event to the slave)
      parameters:
        - description: slave node id
          name: node
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/controller.putSpecBody"
        description: desired engines
        required: true
      responses:
        "204":
          description: accepted and published
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  /v1/status:
    get:
      summary: Node statuses (reported runtime merged with registered nodes)
      responses:
        "200":
          description: status of every node
          content:
            "*/*":
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      $ref: "#/components/schemas/entity.NodeStatus"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
components:
  schemas:
    controller.putSpecBody:
      type: object
      properties:
        engines:
          type: array
          items:
            $ref: "#/components/schemas/entity.Engine"
    controller.queryOutput:
      type: object
      properties:
        output:
          type: string
    controller.queryRequest:
      type: object
      properties:
        engine:
          type: string
        sql:
          type: string
    entity.Engine:
      type: object
      properties:
        env:
          type: object
          additionalProperties:
            type: string
        name:
          type: string
        ports:
          type: object
          additionalProperties:
            type: string
        type:
          type: string
        version:
          type: string
    entity.NodeStatus:
      type: object
      properties:
        detail:
          type: string
        node:
          type: string
        state:
          description: ok | error
          type: string
        ts:
          description: unix seconds
          type: integer
          format: int64
    entity.Spec:
      type: object
      properties:
        engines:
          type: array
          items:
            $ref: "#/components/schemas/entity.Engine"
        node:
          type: string
