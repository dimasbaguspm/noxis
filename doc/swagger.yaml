openapi: 3.0.0
info:
  description: "SQL console API: manage database connections and run"
  title: noxis API
  contact: {}
  version: 0.1.0
paths:
  /auth/config:
    get:
      summary: Public OIDC configuration (console bootstrap)
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/controller.AuthInfo"
  /healthz:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: process is alive
  /internal/tick:
    post:
      summary: Apply every due scheduled change (external cron / scheduler)
      parameters:
        - description: NOXIS_TICK_KEY
          name: X-API-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/controller.TickResult"
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  /v1/config/drivers:
    get:
      summary: List the drivers the console can register
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/controller.DriverInfo"
  "/v1/engine/{engine}/changes":
    get:
      summary: List proposed changes for an engine (newest first)
      parameters:
        - description: engine family (sql, mongodb)
          name: engine
          in: path
          required: true
          schema:
            type: string
        - description: substring match on connection name
          name: connection
          in: query
          schema:
            type: string
        - description: exact status match (unverified, validated, approved, applied,
            failed, rejected)
          name: status
          in: query
          schema:
            type: string
        - description: page number, starting at 1
          name: page
          in: query
          schema:
            type: integer
        - description: items per page (default 20, max 100)
          name: perPage
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                properties:
                  changes:
                    type: array
                    items:
                      $ref: "#/components/schemas/entity.Change"
                  total:
                    type: integer
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
    post:
      summary: Submit a change (validates before recording)
      parameters:
        - description: engine family (sql, mongodb)
          name: engine
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/entity.Change"
        description: connection, notes, query, rollback (sql) or the request (mongodb)
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Change"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/engine/{engine}/changes/{id}":
    get:
      summary: Get one change
      parameters:
        - description: engine family (sql, mongodb)
          name: engine
          in: path
          required: true
          schema:
            type: string
        - description: change id
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Change"
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/engine/{engine}/changes/{id}/apply":
    post:
      summary: Apply an approved change
      parameters:
        - description: engine family (sql, mongodb)
          name: engine
          in: path
          required: true
          schema:
            type: string
        - description: change id
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Change"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/engine/{engine}/changes/{id}/approve":
    post:
      summary: Approve a validated change (self-approval allowed)
      parameters:
        - description: engine family (sql, mongodb)
          name: engine
          in: path
          required: true
          schema:
            type: string
        - description: change id
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Change"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/engine/{engine}/changes/{id}/reject":
    post:
      summary: Reject a change (kept as an artifact, never deleted)
      parameters:
        - description: engine family (sql, mongodb)
          name: engine
          in: path
          required: true
          schema:
            type: string
        - description: change id
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Change"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/engine/{engine}/changes/{id}/schedule":
    post:
      summary: Schedule or unschedule an approved change
      parameters:
        - description: engine family (sql, mongodb)
          name: engine
          in: path
          required: true
          schema:
            type: string
        - description: change id
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/controller.scheduleBody"
        description: scheduledAt unix seconds; 0 clears the schedule
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Change"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/engine/{engine}/connections":
    get:
      summary: List connections (passwords redacted)
      parameters:
        - description: engine family (sql, memcache, mongodb)
          name: engine
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                properties:
                  connections:
                    type: array
                    items:
                      $ref: "#/components/schemas/entity.Connection"
    post:
      summary: Create or update a connection
      parameters:
        - description: engine family (sql, memcache, mongodb)
          name: engine
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/entity.Connection"
        description: connection (omit password to keep the stored one)
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Connection"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/engine/{engine}/connections/{name}":
    get:
      summary: Get one connection (password redacted)
      parameters:
        - description: engine family (sql, memcache, mongodb)
          name: engine
          in: path
          required: true
          schema:
            type: string
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Connection"
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
    delete:
      summary: Delete a connection (and its changes)
      parameters:
        - description: engine family (sql, memcache, mongodb)
          name: engine
          in: path
          required: true
          schema:
            type: string
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: deleted
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/engine/{engine}/connections/{name}/alter":
    post:
      summary: Apply a write directly (DML or DDL)
      parameters:
        - description: engine family (sql)
          name: engine
          in: path
          required: true
          schema:
            type: string
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/controller.opBody"
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Result"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/engine/{engine}/connections/{name}/analyze":
    post:
      summary: Refresh planner statistics for a table
      parameters:
        - description: engine family (sql)
          name: engine
          in: path
          required: true
          schema:
            type: string
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/controller.opBody"
        description: table
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Result"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/engine/{engine}/connections/{name}/collections":
    get:
      summary: List a database's collections with their sizes
      parameters:
        - description: engine family (mongodb)
          name: engine
          in: path
          required: true
          schema:
            type: string
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
        - description: database name
          name: database
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                properties:
                  collections:
                    type: array
                    items:
                      $ref: "#/components/schemas/mongodb.Collection"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/engine/{engine}/connections/{name}/databases":
    get:
      summary: List databases with their sizes
      parameters:
        - description: engine family (mongodb)
          name: engine
          in: path
          required: true
          schema:
            type: string
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                properties:
                  databases:
                    type: array
                    items:
                      $ref: "#/components/schemas/mongodb.Database"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/engine/{engine}/connections/{name}/flush":
    post:
      summary: Empty the connected database (FLUSHDB, never FLUSHALL)
      parameters:
        - description: engine family (memcache)
          name: engine
          in: path
          required: true
          schema:
            type: string
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/controller.memcacheFlushBody"
        description: confirm must repeat the connection name
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                properties:
                  status:
                    type: string
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/engine/{engine}/connections/{name}/grants":
    get:
      summary: List a connection's group grants
      parameters:
        - description: engine family (sql, memcache, mongodb)
          name: engine
          in: path
          required: true
          schema:
            type: string
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                properties:
                  grants:
                    type: array
                    items:
                      $ref: "#/components/schemas/entity.Grant"
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "403":
          description: Forbidden
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
    put:
      summary: Grant an OIDC group a level on a connection
      parameters:
        - description: engine family (sql, memcache, mongodb)
          name: engine
          in: path
          required: true
          schema:
            type: string
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/controller.grantBody"
        description: group and level
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Grant"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "403":
          description: Forbidden
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
    delete:
      summary: Revoke a group's grant on a connection
      parameters:
        - description: engine family (sql, memcache, mongodb)
          name: engine
          in: path
          required: true
          schema:
            type: string
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
        - description: OIDC group name
          name: group
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "403":
          description: Forbidden
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/engine/{engine}/connections/{name}/keys":
    get:
      summary: Browse keys by pattern (bounded scan, with type, TTL and size)
      parameters:
        - description: engine family (memcache)
          name: engine
          in: path
          required: true
          schema:
            type: string
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
        - description: glob pattern (default *)
          name: pattern
          in: query
          schema:
            type: string
        - description: scan cap (default 500, max 5000)
          name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/memcache.KeyPage"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
    delete:
      summary: Remove keys (the selected ones only)
      parameters:
        - description: engine family (memcache)
          name: engine
          in: path
          required: true
          schema:
            type: string
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/controller.memcacheKeysBody"
        description: keys to remove
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/engine/{engine}/connections/{name}/query":
    post:
      summary: Run a SQL console op (query | alter | rollback | analytics)
      parameters:
        - description: engine family (sql)
          name: engine
          in: path
          required: true
          schema:
            type: string
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/controller.opBody"
        description: sql (or table for analytics)
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Result"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/engine/{engine}/connections/{name}/requests":
    post:
      summary: Run a read request (find | aggregate | count)
      parameters:
        - description: engine family (mongodb)
          name: engine
          in: path
          required: true
          schema:
            type: string
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/mongodb.Request"
        description: op, database, collection, filter and value as Extended JSON
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/mongodb.Result"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/engine/{engine}/connections/{name}/rollback":
    post:
      summary: Dry-run statements inside a transaction that always rolls back
      parameters:
        - description: engine family (sql)
          name: engine
          in: path
          required: true
          schema:
            type: string
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        $ref: "#/components/requestBodies/controller.opBody"
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Result"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/engine/{engine}/connections/{name}/schema":
    get:
      summary: Introspect a connection's tables and columns
      parameters:
        - description: engine family (sql)
          name: engine
          in: path
          required: true
          schema:
            type: string
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                properties:
                  tables:
                    type: array
                    items:
                      $ref: "#/components/schemas/sql.Table"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/engine/{engine}/connections/{name}/tables/{table}/rows":
    get:
      summary: Preview a table's rows
      parameters:
        - description: engine family (sql)
          name: engine
          in: path
          required: true
          schema:
            type: string
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
        - description: table name (unqualified)
          name: table
          in: path
          required: true
          schema:
            type: string
        - description: schema (defaults to the driver's)
          name: schema
          in: query
          schema:
            type: string
        - description: row cap (default 100, max 500)
          name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Result"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/engine/{engine}/connections/{name}/test":
    post:
      summary: Test that a connection answers
      parameters:
        - description: engine family (sql, memcache, mongodb)
          name: engine
          in: path
          required: true
          schema:
            type: string
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                properties:
                  status:
                    type: string
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/engine/{engine}/connections/{name}/value":
    get:
      summary: Inspect one key's value (rendered per its type)
      parameters:
        - description: engine family (memcache)
          name: engine
          in: path
          required: true
          schema:
            type: string
        - description: connection name
          name: name
          in: path
          required: true
          schema:
            type: string
        - description: key name
          name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Result"
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  /v1/instances:
    get:
      summary: List instances across engine families (passwords redacted)
      parameters:
        - description: substring match on name
          name: name
          in: query
          schema:
            type: string
        - description: exact driver match
          name: driver
          in: query
          schema:
            type: string
        - description: substring match on host
          name: host
          in: query
          schema:
            type: string
        - description: page number, starting at 1
          name: page
          in: query
          schema:
            type: integer
        - description: items per page (default 20, max 100)
          name: perPage
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                properties:
                  instances:
                    type: array
                    items:
                      $ref: "#/components/schemas/entity.Connection"
                  total:
                    type: integer
  "/v1/instances/{id}":
    get:
      summary: Get one instance across engine families (password redacted)
      parameters:
        - description: instance id
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/entity.Connection"
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  "/v1/instances/{id}/password":
    post:
      summary: Rotate an instance's password (identity fields stay locked)
      parameters:
        - description: instance id
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/controller.passwordBody"
        description: new password
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: object
                properties:
                  status:
                    type: string
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
        "403":
          description: Forbidden
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
  /v1/me:
    get:
      summary: The authenticated caller and its per-connection levels
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/controller.MeResponse"
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                type: object
                additionalProperties:
                  type: string
components:
  requestBodies:
    controller.opBody:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/controller.opBody"
      description: sql
      required: true
  schemas:
    controller.AuthInfo:
      type: object
      properties:
        clientId:
          type: string
        enabled:
          type: boolean
        issuer:
          type: string
    controller.DriverInfo:
      type: object
      properties:
        driver:
          type: string
        family:
          type: string
        label:
          type: string
    controller.MeResponse:
      type: object
      properties:
        admin:
          description: Admin reports membership of the configured global-admin group.
          type: boolean
        connections:
          type: object
          additionalProperties:
            type: string
        groups:
          type: array
          items:
            type: string
        sub:
          type: string
    controller.TickResult:
      description: applied and failed change ids from one tick.
      type: object
      properties:
        applied:
          type: array
          items:
            type: string
        failed:
          type: array
          items:
            type: string
    controller.grantBody:
      type: object
      properties:
        group:
          type: string
        level:
          type: string
    controller.memcacheFlushBody:
      type: object
      properties:
        confirm:
          type: string
    controller.memcacheKeysBody:
      type: object
      properties:
        keys:
          type: array
          items:
            type: string
    controller.mongoChangeBody:
      type: object
    controller.opBody:
      type: object
      properties:
        sql:
          type: string
        table:
          type: string
    controller.passwordBody:
      type: object
      properties:
        password:
          type: string
    controller.scheduleBody:
      type: object
      properties:
        scheduledAt:
          type: integer
    entity.Change:
      type: object
      required:
        - connection
        - notes
        - query
        - rollback
      properties:
        affectedColumns:
          type: array
          items:
            type: string
        affectedTables:
          description: what the batch touches (keyword-anchored, best effort)
          type: array
          items:
            type: string
        appliedAffected:
          type: integer
        appliedAt:
          type: integer
        appliedDurationMs:
          type: integer
        approvedAt:
          type: integer
        checks:
          type: array
          items:
            $ref: "#/components/schemas/entity.ChangeCheck"
        connection:
          type: string
        createdAt:
          type: integer
        estAffected:
          type: integer
        estDurationMs:
          description: measured on the dry run (estimates) and on apply (actuals)
          type: integer
        id:
          type: string
        kind:
          description: dml | ddl
          type: string
        notes:
          type: string
        query:
          type: string
        rejectedAt:
          type: integer
        rollback:
          type: string
        scheduledAt:
          description: |-
            ScheduledAt is the unix time the change should run; 0 means execute
            immediately (on manual apply, as before).
          type: integer
        scratchSchema:
          type: string
        status:
          description: validated | unverified | failed | approved | applied | rejected
          type: string
    entity.ChangeCheck:
      type: object
      properties:
        detail:
          type: string
        error:
          type: string
        ok:
          type: boolean
        target:
          description: query | rollback
          type: string
    entity.Connection:
      type: object
      required:
        - database
        - driver
        - host
        - name
        - port
      properties:
        createdAt:
          type: integer
        database:
          type: string
        driver:
          description: postgres | mysql (mariadb aliases mysql)
          type: string
        family:
          description: |-
            Family names the engine family that serves the driver. It is not
            stored: the cross-family routes set it when serving.
          type: string
        host:
          type: string
        id:
          description: |-
            ID is the stable instance identifier used by the cross-family
            /v1/instances routes. Grants and changes still link by Name.
          type: string
        name:
          type: string
        params:
          description: extra DSN params (sslmode, ...)
          type: object
          additionalProperties:
            type: string
        password:
          type: string
        port:
          type: integer
        user:
          type: string
    entity.Grant:
      type: object
      required:
        - group
        - level
      properties:
        connection:
          type: string
        group:
          type: string
        level:
          type: string
          enum:
            - read
            - write
            - admin
    entity.Result:
      type: object
      properties:
        affected:
          type: integer
        columns:
          type: array
          items:
            type: string
        durationMs:
          type: integer
        estimatedRows:
          type: integer
        message:
          type: string
        rows:
          type: array
          items:
            type: array
            items:
              type: string
        rowsReturned:
          type: integer
        scratchSchema:
          description: |-
            ScratchSchema is set by change validation: the throwaway schema the
            change was verified against, if any.
          type: string
    memcache.Key:
      type: object
      properties:
        name:
          type: string
        sizeBytes:
          type: integer
        ttlMs:
          type: integer
        type:
          type: string
    memcache.KeyPage:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/memcache.Key"
        pattern:
          type: string
        total:
          type: integer
        truncated:
          type: boolean
    mongodb.Collection:
      type: object
      properties:
        avgObjectSizeBytes:
          type: integer
        capped:
          type: boolean
        count:
          type: integer
        indexSizeBytes:
          type: integer
        indexes:
          type: integer
        name:
          type: string
        sizeBytes:
          type: integer
        storageBytes:
          type: integer
        type:
          description: collection | view | timeseries
          type: string
    mongodb.Database:
      type: object
      properties:
        avgObjectSizeBytes:
          type: integer
        collections:
          type: integer
        indexSizeBytes:
          type: integer
        name:
          type: string
        objects:
          type: integer
        sizeBytes:
          description: uncompressed data
          type: integer
        storageBytes:
          description: on-disk
          type: integer
    mongodb.Request:
      type: object
      properties:
        collection:
          type: string
        database:
          type: string
        filter:
          type: string
        limit:
          type: integer
        many:
          type: boolean
        op:
          type: string
        sort:
          type: string
        value:
          type: string
    mongodb.Result:
      type: object
      properties:
        affected:
          type: integer
        columns:
          type: array
          items:
            type: string
        documents:
          type: array
          items:
            type: string
        durationMs:
          type: integer
        estimatedRows:
          type: integer
        message:
          type: string
        rows:
          type: array
          items:
            type: array
            items:
              type: string
        rowsReturned:
          type: integer
        scratchSchema:
          description: |-
            ScratchSchema is set by change validation: the throwaway schema the
            change was verified against, if any.
          type: string
    sql.Column:
      type: object
      properties:
        name:
          type: string
        nullable:
          type: boolean
        type:
          type: string
    sql.Table:
      type: object
      properties:
        columns:
          type: array
          items:
            $ref: "#/components/schemas/sql.Column"
        name:
          type: string
        schema:
          type: string
