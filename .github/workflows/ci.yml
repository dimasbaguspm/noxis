name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
      # A port that gained a method and a mock that did not is a lie the next test tells.
      - name: mocks are generated
        run: make mocks && git diff --exit-code
      # The document is annotations plus a generator; a handler whose annotation moved must move it.
      - name: spec is generated
        run: make spec && git diff --exit-code
      - name: build
        run: make build
      - name: test
        run: make test
      - name: uat
        run: make uat
      - name: coverage floors
        run: make cover
      - uses: actions/upload-artifact@v4
        with:
          name: noxis
          path: bin/noxis
          retention-days: 7

  # The console is TypeScript the Go job never sees: it must typecheck, lint, format and pass its unit
  # tests, or the binary would ship a console nobody compiled the way it is read.
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install
        run: pnpm install --frozen-lockfile
      - name: typecheck, lint, format
        run: pnpm run check
      - name: unit tests
        run: pnpm test
      - name: build the console the binary embeds
        run: pnpm run build
