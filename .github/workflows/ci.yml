name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
      # A port that gained a method and a mock that did not is a lie the next test tells.
      - name: mocks are generated
        run: make mocks && git diff --exit-code
      # The document is annotations plus a generator; a handler whose annotation moved must move it.
      - name: spec is generated
        run: make spec && git diff --exit-code
      - name: build
        run: make build
      - name: test
        run: make test
      - name: uat
        run: make uat
      - name: coverage floors
        run: make cover
      - uses: actions/upload-artifact@v4
        with:
          name: noxis
          path: bin/noxis
          retention-days: 7
