# Two path-filtered jobs, one per side of the repo.
#   go  → lint → build (Dockerfile.api) → unit → UAT
#   web → lint + typecheck + build
# The full Dockerfile is built by the UAT step itself: `make uat` runs
# `docker compose up`, which builds the noxis service image. The API-only image
# (Dockerfile.api) is the one nothing else builds, so it is built here.
# A `changes` gate computes which side moved; the heavy jobs run only for
# their side. UAT brings the real compose stack up (noxis + postgres/redis/
# valkey/mongo/mariadb) on the runner's docker daemon and drives it through the
# REST surface (make uat); the default tag set skips the @slow image-pull
# scenarios.
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - 'apps/api/**'
              - 'Makefile'
              - 'Dockerfile'
              - 'Dockerfile.api'
              - 'docker-compose.yml'
              - '.github/workflows/**'
            web:
              - 'apps/web/**'
              - 'openapi.*'
              - '.github/workflows/**'

  go:
    name: "go: lint, build api image, unit, uat"
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache: true

      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: apps/api

      - name: setup buildx
        uses: docker/setup-buildx-action@v3

      - name: build (Dockerfile.api)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: noxis-api:ci
          cache-from: type=gha,scope=noxis-api
          cache-to: type=gha,mode=max,scope=noxis-api

      - name: unit tests
        run: cd apps/api && go test -count=1 $(go list ./... | grep -v /test/uat)

      - name: uat (real stack via REST)
        run: make uat

  web:
    name: "web: lint, typecheck, build"
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: web (lint + typecheck + build)
        run: |
          npm install -g pnpm@10
          cd apps/web && pnpm install --frozen-lockfile && pnpm lint && pnpm build
