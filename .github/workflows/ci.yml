name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
      - name: build
        run: make build
      - name: test
        run: make test
      - name: uat
        run: make uat
      - uses: actions/upload-artifact@v4
        with:
          name: noxisd
          path: bin/noxisd
          retention-days: 7
