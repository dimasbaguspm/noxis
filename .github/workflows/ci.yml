name: ci

on:
  push:
    branches: [master]
    # A tag is a release: the image a deployment pins, published beside the assets.
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
      # A port that gained a method and a mock that did not is a lie the next test tells.
      - name: mocks are generated
        run: make mocks && git diff --exit-code
      # The document is annotations plus a generator; a handler whose annotation moved must move it.
      - name: spec is generated
        run: make spec && git diff --exit-code
      - name: build
        run: make build
      - name: test
        run: make test
      - name: uat
        run: make uat
      # The @slow suite is the only proof that the engine work runs against a real MySQL and a real
      # MariaDB: a fake cannot disagree with you. It needs docker, and it is why this job is separate.
      - name: uat against real engines
        run: make uat-slow
      - name: coverage floors
        run: make cover
      - uses: actions/upload-artifact@v4
        with:
          name: noxis
          path: bin/noxis
          retention-days: 7

  # The console is TypeScript the Go job never sees: it must typecheck, lint, format and pass its unit
  # tests, or the binary would ship a console nobody compiled the way it is read.
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install
        run: pnpm install --frozen-lockfile
      - name: typecheck, lint, format
        run: pnpm run check
      - name: unit tests
        run: pnpm test
      - name: build the console the binary embeds
        run: pnpm run build

  # Publishing is what makes an update check possible. It runs only for a green commit on master, and it
  # publishes one moving release: the tag `nightly`, whose assets always describe the newest green commit.
  # `version.json` is the artifact every client reads: it names the release line and the seven characters
  # of the commit, so a build can answer "am I older than what was published?" without scraping HTML.
  publish:
    needs: [go, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    # One moving release, so two publishes must never run at once: the second would delete what the first
    # just created. Queue them instead of cancelling one — every green commit deserves its attempt.
    concurrency:
      group: publish-nightly
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: the console the binaries embed
        run: make web
      - name: build both architectures, and the artifact they publish
        run: |
          set -euo pipefail
          COMMIT=$(git rev-parse --short=7 HEAD)
          VERSION=nightly
          mkdir -p dist
          for ARCH in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH go build -trimpath \
              -ldflags "-s -w -X noxis/internal/constants.Version=$VERSION -X noxis/internal/constants.Commit=$COMMIT" \
              -o "dist/noxis-linux-$ARCH" ./cmd/noxis
          done
          printf '{"version":"%s","commit":"%s","built_at":"%s"}\n' \
            "$VERSION" "$COMMIT" "$(git log -1 --format=%cI)" > dist/version.json
          (cd dist && sha256sum noxis-linux-amd64 noxis-linux-arm64 > SHA256SUMS)
          cat dist/version.json
      - name: publish the nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ github.sha }}
        run: |
          # One release, moved to this commit: delete and recreate rather than upload into a stale one, so
          # the tag, the assets and the notes always describe the same build.
          gh release delete nightly --yes --cleanup-tag || true
          # The releases API refuses a create every so often with a 403 that says nothing about the token
          # (the next push publishes fine), so try a few times before calling the build unpublishable.
          for attempt in 1 2 3 4; do
            if gh release create nightly \
              --target "$COMMIT" \
              --title "nightly" \
              --prerelease \
              --notes "Built from https://github.com/${GITHUB_REPOSITORY}/commit/${COMMIT} by CI. Every green commit on master lands here; versions are the first seven characters of the commit." \
              dist/*; then
              exit 0
            fi
            echo "publish attempt ${attempt} failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          exit 1

  # The artifact an operator actually runs: one image, both architectures, stamped with the commit the
  # assets were. A compose file names this instead of a git clone and a Go toolchain. A pull request builds
  # it without pushing, so the Dockerfile cannot rot unnoticed between releases.
  image:
    needs: [go, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: log in to the registry the image lives in
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
      # The tags say which build it is. `nightly` moves with master; a `v*` tag does not; `latest` follows
      # the newest tag and never a nightly. GHCR wants a lowercase path, so the repository is lowered.
      - name: work out what to call it
        id: what
        run: |
          set -euo pipefail
          commit=$(git rev-parse --short=7 HEAD)
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
            tags=$(printf '%s\n%s' "${image}:${version}" "${image}:latest")
          else
            version=nightly
            tags=$(printf '%s\n%s' "${image}:nightly" "${image}:nightly-${commit}")
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          { echo 'tags<<EOF'; echo "${tags}"; echo 'EOF'; } >> "$GITHUB_OUTPUT"
          echo "built as ${version} (${commit}), tagged: ${tags//$'\n'/ }"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          build-args: |
            VERSION=${{ steps.what.outputs.version }}
            COMMIT=${{ steps.what.outputs.commit }}
          tags: ${{ steps.what.outputs.tags }}
          labels: |
            org.opencontainers.image.title=noXis
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.what.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image
