# The policy, not the tool's defaults. Every linter here catches a defect that reached review in
# this tree or would have. They are grouped by what each one protects, because a list sorted by
# nothing teaches nothing: a reader who adds a linter knows which group it joins and why.
version: "2"

linters:
  default: standard
  enable:
    # --- correctness: the code says one thing and does another -------------------------------
    - bodyclose      # a response body is a file descriptor
    - errorlint      # errors.Is/As, not ==, on a wrapped error
    - noctx          # a request without a context cannot be cancelled
    - rowserrcheck   # an iterator whose Err() nobody read
    - sqlclosecheck  # a rows/statement nobody closed
    - wastedassign   # an assignment nothing reads
    - asasalint      # append(s, x...) where x is not the same slice type
    - containedctx   # a context stored in a struct outlives the request it belongs to
    - durationcheck  # time.Duration * time.Duration is not a duration
    - errchkjson     # json.Marshal whose error nobody read
    - forcetypeassert # an unchecked type assertion panics on a value nobody expected
    - makezero       # append into a slice that already has a length
    - musttag        # a struct marshalled as JSON without tags puts field names on the wire
    - nilerr         # `if err != nil { return nil }`, which swallows the failure
    - nilnil         # (nil, nil): a caller cannot tell "absent" from "broken"
    - usestdlibvars  # "GET" where http.MethodGet exists, and the rest

    # --- security: what a remote caller or a filesystem gets to decide -----------------------
    - gosec          # a permission, a random source, an injected string
    - bidichk        # a bidirectional override that reorders what the code looks like

    # --- style: readable, not merely correct -------------------------------------------------
    - copyloopvar    # Go 1.22 loop variables, but a copy that is now pointless is still noise
    - gocritic       # the diagnostic and style checks that catch real mistakes
    - misspell       # a typo in a comment is still a typo
    - revive         # the exported-doc and early-return rules the tree already follows
    - unconvert      # a conversion that does nothing
    - whitespace     # the stray blank line at the top of a block
    - dupword        # a doubled word in a comment
    - errname        # ErrFoo for a value, FooError for a type
    - gocheckcompilerdirectives # a //go: directive the compiler will ignore
    - intrange       # `for i := 0; i < n; i++` where `for range n` says it
    - mirror         # []byte(s) where a String is cheaper, and the reverse
    - nolintlint     # a //nolint that names no linter, or one it does not need
    - unparam        # a parameter every caller passes the same value

    # --- performance: the cost nobody asked for ----------------------------------------------
    - prealloc       # a slice grown in a loop of known length
    - perfsprint     # fmt.Sprintf where a string concatenation is free

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - style
      disabled-checks:
        - ifElseChain        # a chain of two is often the clearest form
        - singleCaseSwitch
        - sloppyReassign
        - unnamedResult     # a named result is a choice, not a rule: this tree names one when a
                            # deferred span or a naked return reads better with it
        - sqlQuery          # the client's Query returns rows on purpose; the leak check is wrong here
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: errorf
        - name: indent-error-flow
        - name: superfluous-else
        - name: unused-parameter
        - name: unused-receiver
    gosec:
      excludes:
        - G104 # an ignored error is errcheck's job, and it has a better message
        - G202 # SQL built from constant fragments and `?` placeholders, never from a value:
                # the tree has six of them and each one is a keyset query, not a concatenation
                # of user input
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      # A test may ignore what a handler would not: a fixture write that fails fails the test
      # somewhere else anyway, and the assertion is the point.
      - path: _test\.go
        linters: [errcheck, gosec, noctx, bodyclose, prealloc, gocritic, unparam, dupword]
      # swag's own grammar repeats a word: `@Param body body handlers.X true "..."` names the parameter
      # and then its location. The annotations are the swagger document, not prose.
      - path: cmd/noxis/http/handlers/
        linters: [dupword]
      # The acceptance harness is a test: it opens sockets it chose and files it just wrote.
      - path: test/
        linters: [gosec, noctx, bodyclose]

formatters:
  enable:
    - gofumpt
    - goimports
