# golangci-lint v2 (run: make lint)
version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
  settings:
    errcheck:
      # Close() on these is deferrable and expected — lets us write
      # `defer rows.Close()` instead of defer func() { _ = rows.Close() }()
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close