# Dev/UAT stack: noxis itself plus target postgres and redis. In real use the
# database already exists somewhere and noxis just connects to it — these
# services are the local stand-ins so the console has something to talk to.
name: noxis

services:
  noxis:
    build:
      context: .
      dockerfile: Dockerfile
    command: run server
    environment:
      NOXIS_LISTEN: ":9000"
      NOXIS_DB: /data/noxis.db
      NOXIS_OTEL_NAME: noxis
    ports:
      - "9000:9000"
    volumes:
      - noxis-data:/data
    # The console is only as useful as the targets it can reach, so the demo
    # stack comes up in order: `up -d` returns with both already healthy,
    # which is what makes the acceptance suite deterministic.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      valkey:
        condition: service_healthy
      mongo:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s
    restart: unless-stopped

  # The scheduler runs as its own process (same image, different command) and
  # drives the server's /internal/callback/scheduler endpoint — the server carries no ticker.
  ticker:
    build:
      context: .
      dockerfile: Dockerfile
    command: run ticker
    environment:
      NOXIS_TICK_HOST: http://noxis:9000
      NOXIS_TICK_INTERVAL: 30s
    depends_on:
      noxis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: noxis
      POSTGRES_DB: demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d demo"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  # A document database for the MongoDB family. Auth is on so the console's
  # user/password path is the one exercised.
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: noxis
      MONGO_INITDB_DATABASE: demo
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # A MySQL-family stand-in: the scratch-schema verifier needs a driver whose
  # DDL commits implicitly to prove the point.
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: noxis
      MARIADB_ROOT_HOST: "%"
      MARIADB_DATABASE: demo
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Valkey is a Redis-protocol fork; the suite registers it as its own driver
  # to keep that claim honest.
  valkey:
    image: valkey/valkey:8-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  console:
    image: node:22-alpine
    profiles: [dev]
    entrypoint: ["/bin/sh", "-c"]
    command: ["corepack enable && corepack prepare pnpm@10.34.5 --activate && cd /web && pnpm install && pnpm dev"]
    environment:
      VITE_PROXY_TARGET: http://noxis:9000
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/web
      - web_node_modules:/web/node_modules
    depends_on:
      noxis:
        condition: service_healthy

volumes:
  noxis-data:
  web_node_modules:
