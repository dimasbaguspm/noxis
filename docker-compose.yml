# A local stack: the API, the console, and a MySQL to point them at.
#
#   docker compose up -d --build
#   open http://localhost:3000          # the console
#   curl localhost:9000/healthz
#
# Everything is a default you can override in a `.env` beside this file; the defaults are development
# secrets and say so. `docker compose down -v` throws the state file away with them.
name: noxis

x-noxis: &noxis
  build:
    context: .
    args:
      # What this build is. `COMMIT=$(git rev-parse --short=7 HEAD) docker compose up -d --build` stamps it;
      # without it the binary says `dev` and claims no commit, which is the honest answer.
      VERSION: ${VERSION:-dev}
      COMMIT: ${COMMIT:-unknown}
  image: noxis:local
  restart: unless-stopped

services:
  api:
    <<: *noxis
    command: ["http", "serve", "--addr", ":9000", "--state", "/data/noxis.db"]
    environment:
      # Two callers: an agent that proposes, and an operator that decides. A secret is at least 32
      # characters; the pair below is a development default and nothing else.
      TOKENS: >-
        ${TOKENS:-{"agent":{"secret":"dev_agent_0123456789abcdef0123456789","scopes":["read","propose"]},"ops":{"secret":"dev_ops_0123456789abcdef0123456789aa","scopes":["read","propose","approve","apply","admin"]}}}
      # 32 bytes, hex. Seals target passwords; a different key refuses the rows it did not write.
      SECRET_KEY: ${SECRET_KEY:-9f2c1e7a4b6d8035caf17e2b9d4a6f8c1e3b5d7092a4c6e8f0b1d3a5c7e9f2b4}
      # The browser origin the console is served from, so a browser may call :9000 from :3000.
      CONSOLE_ORIGINS: ${CONSOLE_ORIGINS:-http://localhost:3000}
      QUERY_TIMEOUT: ${QUERY_TIMEOUT:-30s}
      PROBE_TIMEOUT: ${PROBE_TIMEOUT:-5s}
    ports:
      - "${API_PORT:-9000}:9000"
    volumes:
      - noxis-data:/data
    healthcheck:
      # The binary asks its own route: distroless has no curl, and this measures what a client gets.
      test: ["CMD", "/noxis", "http", "healthcheck", "--url", "http://127.0.0.1:9000"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  console:
    <<: *noxis
    # --api is the address the *browser* reaches the API on, which is why it is not the service name.
    command:
      ["web", "serve", "--api", "${API_PUBLIC_URL:-http://localhost:9000}", "--port", "3000"]
    ports:
      - "${CONSOLE_PORT:-3000}:3000"
    # The console never touches the state file; a tmpfs keeps the image's /data out of the way.
    tmpfs:
      - /data
    healthcheck:
      # The image's own probe asks the API on :9000, which this container does not run; a probe that
      # can never pass is worse than none.
      disable: true
    depends_on:
      api:
        condition: service_healthy

  # A real engine to register, published on 3307 so it never fights a MySQL you already run. MySQL and
  # MariaDB are the only two this build speaks; swap the image for `mariadb:11.4` to try the other one —
  # the probe reports which it found.
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-noxis}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-noxis}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # A table to look at, and a row to read: registering an empty schema teaches nothing.
      - ./scripts/local-seed.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  noxis-data:
  mysql-data:
