syntax = "proto3";

package noxis.v1;

option go_package = "noxis/internal/repository/grpc;rpc";

// Internal master<->slave transport only. The public API is REST
// (internal/repository/rest); this exists to push spec events to slave
// workers and receive status/query answers back over one bidirectional river.
message EngineSpec {
  string name = 1;
  string type = 2;
  string version = 3;
  map<string, string> ports = 4;
  map<string, string> env = 5;
}

message DesiredSpec {
  repeated EngineSpec engines = 1;
}

message StreamMsg {
  string node = 1;
  oneof payload {
    DesiredSpec spec = 2;
    QueryRequest query = 3;
    QueryResult result = 4;
  }
}

message QueryRequest {
  int64 id = 1;
  string engine = 2;
  string sql = 3;
}

message QueryResult {
  int64 id = 1;
  string output = 2;
  string error = 3;
}

message Status {
  string node = 1;
  string state = 2;
  string detail = 3;
  int64 ts = 4;
}

message Empty {}

service Control {
  rpc Watch(stream StreamMsg) returns (stream StreamMsg);
  rpc ReportStatus(Status) returns (Empty);
}